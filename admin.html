<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gerenciamento - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="admin.html">Painel Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="admin.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="influencers.html">Influencers</a></li>
                    <li class="nav-item"><a class="nav-link" href="coupons.html">Cupons</a></li>
                </ul>

                <!-- Área de Autenticação -->
                <div class="d-flex align-items-center gap-2">
                    <!-- Exibido quando NÃO estiver logado -->
                    <button id="btn-login" class="btn btn-outline-light btn-sm">
                        🔑 Entrar com Google
                    </button>

                    <!-- Exibido quando estiver LOGADO -->
                    <div id="user-info" class="d-none align-items-center gap-2 text-white">
                        <img id="user-photo" src="" alt="User" class="rounded-circle" width="32" height="32">
                        <span id="user-email" class="small fw-semibold"></span>
                        <button id="btn-logout" class="btn btn-danger btn-sm ms-2">
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
            <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-cash-stack me-2"></i>Gestão de Comissões</h5>
        
        <!-- Filtro por Status -->
        <div class="d-flex align-items-center gap-2">
            <label for="filter-comm-status" class="form-label mb-0 small text-muted">Filtrar:</label>
            <select id="filter-comm-status" class="form-select form-select-sm" style="width: auto;">
                <option value="Pendente" selected>Pendentes</option>
                <option value="Pago">Pagas</option>
                <option value="Cancelado">Canceladas</option>
                <option value="TODOS">Todas</option>
            </select>
        </div>
    </div>

    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Influencer / E-mail</th>
                        <th>Cupom</th>
                        <th>Pedido ID</th>
                        <th>Valor Comissão</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="commissions-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">Carregando comissões...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-primary text-white p-3">
                    <h6 class="text-uppercase small">Total de Pedidos</h6>
                    <h3 id="dash-total-orders" class="mb-0">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-success text-white p-3">
                    <h6 class="text-uppercase small">Comissões a Pagar</h6>
                    <h3 id="dash-total-commissions" class="mb-0">R$ 0,00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-info text-white p-3">
                    <h6 class="text-uppercase small">Cupons Ativos</h6>
                    <h3 id="dash-active-coupons" class="mb-0">0</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h5 class="mb-3">Ações e Gestão do Sistema</h5>
            <div class="d-flex flex-wrap gap-2">
                <a href="influencers.html" class="btn btn-outline-primary">👤 Gerenciar Influencers</a>
                <a href="coupons.html" class="btn btn-outline-success">🏷️ Gerenciar Cupons</a>
                <button id="btn-init-counters" class="btn btn-outline-secondary">⚙️ Inicializar Contadores</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin-dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
