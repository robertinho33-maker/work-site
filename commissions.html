<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Comissões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="admin.html">Painel Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="admin.html">Dashboard</a>
                <a class="nav-link" href="influencers.html">Influencers</a>
                <a class="nav-link" href="coupons.html">Cupons</a>
                <a class="nav-link active" href="commissions.html">Comissões</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">Comissões de Influencers / Afiliados</h5>
                <select id="filter-status" class="form-select w-auto">
                    <option value="todos">Todos os Status</option>
                    <option value="Pendente" selected>Pendentes</option>
                    <option value="Paga">Pagas</option>
                </select>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Afiliado / Cupom</th>
                            <th>Total Pedido</th>
                            <th>Comissão (%)</th>
                            <th>Valor Comissão</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="table-commissions"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="js/commissions.js"></script>
</body>
</html>
